<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>HirePool - Apply</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/dashboard.css"></head><body data-page="apply">
<div class="center"><div class="card" style="width:560px" id="box"><div class="brand" style="padding:0 0 8px">Hire<b>Pool</b></div><p id="ag" style="margin:0 0 10px;color:var(--mut);font-weight:600"></p>
<div id="done" style="display:none"><h2>Application submitted</h2><p>Thank you. The agency will contact you if you are shortlisted.</p></div>
<form id="f" novalidate><h2 id="hd"></h2><p style="color:var(--mut);margin:4px 0 0">Choose your position and fill in your details.</p>
<label for="pos">Position applying for</label><select id="pos"></select><label for="n">Full name</label><input id="n" autocomplete="name"><label for="ph">Phone / WhatsApp</label><input id="ph" type="tel"><label for="em">Email</label><input id="em" type="email">
<label for="ex">Total relevant experience (years)</label><input id="ex" type="number" min="0" max="50"><label for="cl">Current location</label><input id="cl"><label for="pl">Preferred work location</label><input id="pl" placeholder="e.g. Kuwait, Saudi Arabia"><label for="sk">Skills and certifications</label><input id="sk" placeholder="ASNT Level II UT, PT, MT, PAUT">
<label for="cv">Resume (PDF, max 20 MB)</label><input id="cv" type="file" accept="application/pdf"><label style="font-weight:400;display:flex;gap:8px;margin-top:14px"><input id="ok" type="checkbox" style="width:auto"> I consent to this agency storing my resume and details for recruitment purposes. Only the agency can view them, and I can ask the agency to delete them at any time.</label>
<div class="err" id="er"></div><button class="btn" style="width:100%;padding:12px">Submit application</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
